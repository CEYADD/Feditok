name: Android Debug Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configura Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Genera Timestamp per il nome
        id: timestamp
        run: |
          echo "date_str=$(date +'%Y-%m-%d_%H-%M')" >> "$GITHUB_OUTPUT"

      - name: Build Android APK Debug
        run: |
          flutter build apk --debug

      - name: Rinomina e sposta APK
        run: |
          mkdir -p "android/Android Debug Releses"
          cp build/app/outputs/flutter-apk/app-debug.apk "android/Android Debug Releses/DEBUG RELEASE - ${{ steps.timestamp.outputs.date_str }}.apk"

      - name: Carica Artifact (Scaricabile da GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK-${{ steps.timestamp.outputs.date_str }}
          path: "android/Android Debug Releses/DEBUG RELEASE - ${{ steps.timestamp.outputs.date_str }}.apk"

      - name: Commit e Push del file nella repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "android/Android Debug Releses/*.apk"
          git commit -m "build(android): auto-generated DEBUG RELEASE - ${{ steps.timestamp.outputs.date_str }}" || echo "Nessuna modifica da inviare"
          git push
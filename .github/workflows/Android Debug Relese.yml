name: Android Debug Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configura Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Genera Timestamp per il nome
        id: timestamp
        run: |
          echo "date_str=$(date +'%Y-%m-%d_%H-%M')" >> "$GITHUB_OUTPUT"

      - name: Build Android APK Debug
        run: |
          flutter build apk --debug

      - name: Rinomina e sposta APK
        run: |
          mkdir -p "android/Android Debug Releses"
          cp build/app/outputs/flutter-apk/app-debug.apk "android/Android Debug Releses/DEBUG RELEASE - ${{ steps.timestamp.outputs.date_str }}.apk"

      - name: Carica Artifact (Scaricabile da GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK-${{ steps.timestamp.outputs.date_str }}
          path: "android/Android Debug Releses/DEBUG RELEASE - ${{ steps.timestamp.outputs.date_str }}.apk"

      - name: Configura Git LFS e verifica dimensione file
        run: |
          # Configura utente git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Percorso del file APK generato
          APK_PATH="android/Android Debug Releses/DEBUG RELEASE - ${{ steps.timestamp.outputs.date_str }}.apk"

          # Ottieni la dimensione del file in byte
          FILE_SIZE=$(stat -c%s "$APK_PATH")
          THRESHOLD=$((100 * 1024 * 1024)) # 100 MB in byte

          echo "Dimensione file: $((FILE_SIZE / 1024 / 1024)) MB"

          if [ "$FILE_SIZE" -ge "$THRESHOLD" ]; then
            echo "Il file è >= 100MB. Configuro e uso Git LFS."
            sudo apt-get update && sudo apt-get install -y git-lfs
            git lfs install
            git lfs track "*.apk"
            git add .gitattributes
          else
            echo "Il file è inferiore a 100MB, procedo con Git standard."
          fi

          git add "$APK_PATH"

      - name: Commit e Push del file nella repo
        run: |
          git commit -m "build(android): auto-generated DEBUG RELEASE - ${{ steps.timestamp.outputs.date_str }}" || echo "Nessuna modifica da inviare"
          git push origin main
          git lfs push origin main

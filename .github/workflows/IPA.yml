name: Add IPA to Latest Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Compila l'applicazione Flutter senza richiedere la firma ufficiale Apple
      - name: Build IPA (Unsigned)
        run: flutter build ipa --no-codesign

      # PASSO LOGICO: Recupera il tag dell'ultima release creata e l'orario attuale italiano (CEST/CET)
      - name: Get Latest Release Tag and Timestamp
        id: release_info
        run: |
          # Trova l'ultimo tag di release presente su GitHub
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Genera il timestamp formattato (Ora:Minuti del giorno/Mese/Anno)
          TIMESTAMP=$(date +'%H:%M %d/%m/%Y')
          echo "time=$TIMESTAMP" >> $GITHUB_OUTPUT

      # PASSO FINALE: Prende l'ipa e aggiorna l'ultima release esistente aggiungendo il testo
      - name: Update Latest Release with IPA
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/ios/ipa/*.ipa"
          tag: ${{ steps.release_info.outputs.tag }} # Si attacca esattamente all'ultimo tag esistente
          name: "Latest iPhone Build - Autogenerated" # Mantiene il titolo pulito per l'artefatto
          # Prende la descrizione esistente della tua release e ci appende la riga che hai chiesto in fondo
          body: |
            Github action - IPA file added to the release ${{ steps.release_info.outputs.tag }} at ${{ steps.release_info.outputs.time }}.
          allowUpdates: true # Permette di modificare una release già esistente
          appendBody: true # FONDAMENTALE: non cancella il tuo testo precedente, ma aggiunge la riga in fondo
          token: ${{ secrets.GITHUB_TOKEN }}

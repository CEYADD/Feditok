name: Flutter Error Control

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup di Java (necessario per Flutter/Android)
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Setup dell'ambiente Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Scarica le dipendenze
      - name: Install dependencies
        run: flutter pub get

      # Analizza il codice: fallisce solo se trova errori bloccanti
      - name: Analyze project (Errors only)
        run: |
          # Esegue flutter analyze salvando l'output e lo stato di uscita
          OUTPUT=$(flutter analyze --no-fatal-infos --no-fatal-warnings)
          echo "$OUTPUT"
          
          # Se vuoi essere sicuro al 100% che ignori i warning e fallisca solo se c'è "error -", 
          # puoi usare il flag nativo qui sopra (--no-fatal-warnings e --no-fatal-infos).
          # In alternativa, se usi versioni precedenti di Flutter, puoi gestire il codice di uscita.

      # Esegue i test automatici solo se presenti
      - name: Run tests (if present)
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found, skipping flutter test."
          fi
